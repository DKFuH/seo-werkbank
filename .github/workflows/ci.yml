name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        exclude:
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.11" }
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t seo-toolkit:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name seo -p 8000:8000 seo-toolkit:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs seo
          exit 1
      - name: Smoke test docker compose
        shell: bash
        run: |
          # Failures are also written as annotations so they are readable without signing in to GitHub.
          note() { echo "::error title=$1::$(paste -sd' ' "$2" | cut -c1-1800)"; }
          docker rm -f seo
          if ! docker compose up -d --build > /tmp/compose-up.log 2>&1; then
            note "docker compose up failed" /tmp/compose-up.log
            cat /tmp/compose-up.log
            exit 1
          fi
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health; then docker compose down -v; exit 0; fi
            sleep 2
          done
          docker compose ps -a > /tmp/compose-state.log 2>&1
          docker compose logs --no-color --tail 40 >> /tmp/compose-state.log 2>&1
          note "docker compose never became healthy" /tmp/compose-state.log
          cat /tmp/compose-state.log
          docker compose down -v
          exit 1
      - name: Smoke test docker compose with PostgreSQL
        shell: bash
        run: |
          note() { echo "::error title=$1::$(paste -sd' ' "$2" | cut -c1-1800)"; }
          PW=$(openssl rand -hex 16)
          printf 'POSTGRES_PASSWORD=%s\nSEO_DATABASE_URL=postgresql+psycopg://seotoolkit:%s@postgres:5432/seotoolkit\nSEO_ALLOW_REGISTRATION=true\n' "$PW" "$PW" > .env
          C="docker compose -f docker-compose.yml -f docker-compose.postgres.yml"
          if ! $C up -d --build > /tmp/pg-up.log 2>&1; then
            note "postgres compose up failed" /tmp/pg-up.log
            cat /tmp/pg-up.log
            exit 1
          fi
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            $C ps -a > /tmp/pg-state.log 2>&1
            $C logs --no-color --tail 40 >> /tmp/pg-state.log 2>&1
            note "postgres compose never became healthy" /tmp/pg-state.log
            cat /tmp/pg-state.log
            exit 1
          fi
          # A write through the API proves the migrations and the ORM work on PostgreSQL, not just that the process started.
          if ! curl -fsS -X POST http://127.0.0.1:8000/api/auth/register -H 'Content-Type: application/json' \
               -d '{"email":"ci@example.com","password":"correct horse battery"}' > /tmp/pg-register.log 2>&1; then
            $C logs --no-color --tail 40 app >> /tmp/pg-register.log 2>&1
            note "register against PostgreSQL failed" /tmp/pg-register.log
            exit 1
          fi
          $C exec -T postgres psql -U seotoolkit -d seotoolkit -tAc "select count(*) from users"
          $C down -v
          rm -f .env
      - name: Smoke test full Docker stack with private SearXNG
        shell: bash
        run: |
          set -e
          # Full stack has its own Compose project and persistent volumes.
          python scripts/full_stack.py init
          C="docker compose -f docker-compose.full.yml"
          if ! $C config --quiet; then
            echo "::error::Full-stack Compose configuration is invalid"
            exit 1
          fi
          if ! $C up -d --build > /tmp/full-up.log 2>&1; then
            cat /tmp/full-up.log
            exit 1
          fi
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            $C ps -a
            $C logs --no-color --tail 40
            exit 1
          fi
          $C exec -T app python -c "from app.db import session_scope; from app.services.settings_store import get_setting; s=session_scope(); db=s.__enter__(); cfg=get_setting(db,'serp'); assert cfg['provider']=='searxng' and cfg['searxng_url']=='http://searxng:8080', cfg; s.__exit__(None,None,None)"
          # Check JSON endpoint, without requiring a particular live engine result.
          $C exec -T app python -c "import json, urllib.request; r=urllib.request.urlopen('http://searxng:8080/search?q=searxng&format=json', timeout=65); d=json.load(r); assert isinstance(d.get('results'),list), d"
          $C down -v
          rm -f .env

  browser-diagnostics:
    runs-on: ubuntu-latest
    env:
      SEO_RENDER_SANDBOX: "false" # GitHub-hosted Chromium cannot use its Linux sandbox; CI only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: pip install -e ".[dev,render]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_render.py
      - run: npm install -g lighthouse
      - name: Set Chrome path from Playwright
        shell: bash
        run: |
          CHROME=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Local Lighthouse (real Chromium, localhost fixture)
        run: pytest -q tests/test_local_lighthouse_ci.py

  demo-capture:
    runs-on: ubuntu-latest
    env:
      SEO_DATA_DIR: ${{ runner.temp }}/seo-werkbank-demo
      SEO_SCHEDULER_ENABLED: "false"
      SEO_DEMO_URL: "http://127.0.0.1:8000"
      SEO_DEMO_EMAIL: "demo@example.org"
      SEO_DEMO_PASSWORD: "ci-demo-password-only"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install app and real browser
        run: |
          python -m pip install -e "./backend[dev,render]"
          python -m playwright install --with-deps chromium
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
      - name: Run isolated demo instance
        shell: bash
        run: |
          set -e
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/seo-demo.log 2>&1) &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS -X POST http://127.0.0.1:8000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.org","password":"ci-demo-password-only"}' > /tmp/demo-login.json
          python - <<'PY'
          import json
          import urllib.request
          payload = json.load(open('/tmp/demo-login.json'))
          req = urllib.request.Request('http://127.0.0.1:8000/api/sites',
              data=json.dumps({'name':'Demo-Website','url':'https://example.org/'}).encode(),
              headers={'Content-Type':'application/json','Authorization':'Bearer '+payload['access_token']})
          with urllib.request.urlopen(req, timeout=10) as result:
              assert result.status == 201
          PY
      - name: Record real screenshots and WebM
        run: python scripts/capture_demo.py
      - name: Attach real demo capture (never upload personal production content)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: seo-werkbank-demo-assets
          path: docs/media/generated/
          if-no-files-found: warn
